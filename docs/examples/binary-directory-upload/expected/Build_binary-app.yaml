apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    crane.konveyor.io/conversion-warnings: |-
      [buildconfig-test/binary-app] BuildConfig buildconfig-test/binary-app sets dockerStrategy.env artifact_url, artifact_name. OpenShift added these as an ENV instruction after each FROM in the Dockerfile, but on Shipwright they only reach the build container, so RUN steps and the output image do not see them. Add ENV <name>=<value> after each FROM in the Dockerfile, or see https://redhat.atlassian.net/browse/BUILD-2499
      [buildconfig-test/binary-app] BuildConfig buildconfig-test/binary-app was a binary build: each build used the files sent by oc start-build --from-dir, --from-archive or --from-repo. The new Build gets its files the same way, but through shp: run 'shp build upload binary-app <directory>' for every build. A build started any other way waits 10m0s for files and then fails. shp does not send everything oc did: it skips files listed in the directory's .gitignore, such as a target/app.jar you built locally, and symlinks that point outside the directory.
      [buildconfig-test/binary-app] BuildConfig 'binary-app' mounts ConfigMap 'cluster-ca-certs' to 'certs' during build. Shipwright uses BuildVolume to mount ConfigMaps, which requires the ClusterBuildStrategy to define an overridable volume. To migrate: (1) add an overridable volume named 'cluster-ca-certs' in the ClusterBuildStrategy, (2) add a BuildVolume override in the Build spec referencing the ConfigMap, (3) update your Dockerfile to use 'RUN cp' instead of 'ADD/COPY' for ConfigMap files.
      [buildconfig-test/binary-app] BuildConfig 'binary-app' mounts secret 'nexus' to 'nexusSecret' during build. Shipwright uses BuildVolume to mount secrets, which requires the ClusterBuildStrategy to define an overridable volume. To migrate: (1) add an overridable volume named 'nexus' in the ClusterBuildStrategy, (2) add a BuildVolume override in the Build spec referencing the secret, (3) update your Dockerfile to use 'RUN cp' instead of 'ADD/COPY' for secret files.
      [buildconfig-test/binary-app] No explicit pushSecret found for DockerImage output. Set spec.output.pushSecret to a registry credential secret, or ensure the BuildRun ServiceAccount carries credentials for the target registry; otherwise the push will fail.
      [buildconfig-test/binary-app] BuildConfig binary-app uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/binary-app
  labels:
    app: binary-app
  name: binary-app
  namespace: buildconfig-test
spec:
  env:
  - name: artifact_url
    value: https://nexus.example.internal/repository/deploy/app.jar
  - name: artifact_name
    value: app.jar
  output:
    image: registry.example.internal/binary-app:1.2.2
  paramValues:
  - name: runtime-stage-from
    value: registry.example.internal/base-images/java/openjdk-21:latest
  - name: dockerfile
    value: Dockerfile
  retention:
    failedLimit: 2
    succeededLimit: 2
  source:
    local:
      name: local-copy
      timeout: 10m0s
    type: Local
  strategy:
    kind: ClusterBuildStrategy
    name: buildah
