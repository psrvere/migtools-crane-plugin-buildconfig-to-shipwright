name: Release

# Run "Create release branch" first. This refuses to run anywhere but the
# release branch that workflow makes, so a release can never be cut from main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0."
        required: true
      previous-version:
        description: "Release to compare against for the notes, e.g. v0.1.2. Leave empty and GitHub picks the preceding tag, which is usually right."
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check the version and the branch agree
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          rest=${VERSION#v}
          if [ "$rest" = "$VERSION" ]; then
            echo "version must start with v, got '$VERSION'"
            exit 1
          fi

          # Split a pre-release suffix off first. Issue #61 asks for alpha,
          # beta and rc builds before a final release, so v0.1.0-alpha.1 has
          # to get through, and trimming at the last dot would read its series
          # as 0.1.0-alpha.
          core=${rest%%-*}
          case "$rest" in
            *-*)
              pre=${rest#*-}
              if [ -z "$pre" ]; then
                echo "'$VERSION' ends in a dash with no pre-release after it."
                exit 1
              fi
              if ! printf '%s' "$pre" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.]*$'; then
                echo "pre-release '$pre' must be alphanumerics and dots, like alpha.1 or rc1."
                exit 1
              fi
              ;;
          esac

          if ! printf '%s' "$core" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be vMAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

          # The plugin is pre-1.0 and a major release is a decision to make
          # deliberately, not by typing it into a workflow box.
          major=${core%%.*}
          if [ "$major" != "0" ]; then
            echo "'$VERSION' is a major release. This workflow ships 0.x only."
            echo "A 1.0 is a deliberate call: agree it first, then change this check."
            exit 1
          fi

          # main carries the next version, not a released one. Cutting a
          # release from it would tag a moving target.
          case "$BRANCH" in
            release-*) ;;
            *) echo "refusing to release from '$BRANCH'."
               echo "Run the Create release branch workflow, then run this against release-0.Y."
               exit 1 ;;
          esac

          # v0.1.3 belongs on release-0.1. Catching this here stops a patch
          # landing on the wrong line.
          minor=${core#*.}
          minor=${minor%%.*}
          if [ "$BRANCH" != "release-0.$minor" ]; then
            echo "$VERSION belongs on release-0.$minor, but this is $BRANCH."
            exit 1
          fi

      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This job holds contents: write and then runs the release branch's
          # own tests. Leaving the token in .git/config puts it where that code
          # could read it. Nothing here pushes with git: the tag and notes
          # steps only read, and the release is published through the API.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Refuse to reuse a tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists. Pick the next patch version."
            exit 1
          fi

      - name: Verify go.mod is tidy
        env:
          GOPROXY: "https://proxy.golang.org"
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run unit tests
        env:
          GOPROXY: "https://proxy.golang.org"
        run: go test ./... -count=1

      # plugin-manager matches os and arch exactly against the running machine,
      # so a platform missing here is a platform that cannot install the plugin.
      # These five are the set crane itself publishes.
      - name: Build the plugin for every published platform
        env:
          GOPROXY: "https://proxy.golang.org"
          VERSION: ${{ inputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          ldflags="-X github.com/migtools/crane-plugin-buildconfig-to-builds/buildconfig.PluginVersion=${VERSION}"

          while read -r os arch; do
            out="bin/${arch}-${os}-buildconfigtobuildsplugin-${VERSION}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$out" .

            # An ldflags path that stops matching the source silently leaves the
            # placeholder in place, and the plugin then reports "devel" to crane
            # for the rest of the release's life.
            if ! strings "$out" | grep -Fq "$VERSION"; then
              echo "$out does not carry $VERSION. Check the -X path against buildconfig.PluginVersion."
              exit 1
            fi
          done <<'PLATFORMS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          PLATFORMS
          ls -l bin

      - name: Write checksums
        run: |
          cd bin
          sha256sum * > checksums.txt
          cat checksums.txt

      # GitHub writes the changelog from the commits between the previous tag
      # and this one, and picks that previous tag itself when nothing says
      # otherwise. On the very first release there is no previous tag, so it
      # reaches back to the first commit: every dependabot bump and every
      # agent-skill PR this repo has ever merged, which is nobody's changelog.
      - name: Work out what the notes compare against
        id: notes
        env:
          PREVIOUS: ${{ inputs.previous-version }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            if ! git rev-parse -q --verify "refs/tags/$PREVIOUS" >/dev/null; then
              echo "previous-version '$PREVIOUS' is not a tag here. Check the spelling against the releases page."
              exit 1
            fi
            echo "comparing against $PREVIOUS"
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git tag --list 'v*')" ]; then
            echo "letting GitHub pick the preceding tag"
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "previous=" >> "$GITHUB_OUTPUT"
          else
            echo "no tag exists yet, so this is the first release: writing no changelog"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "previous=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ inputs.version }}
          draft: true
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          previous_tag: ${{ steps.notes.outputs.previous }}
          fail_on_unmatched_files: true
          files: |
            bin/*
          body: |
            Plugin binaries for `crane plugin-manager`.

            Installing this release needs a matching entry in the crane plugin
            index at https://github.com/migtools/crane-plugins. Until that entry
            merges, download the binary for your platform from this page and
            point `crane transform` at it with `--plugin-dir`.
