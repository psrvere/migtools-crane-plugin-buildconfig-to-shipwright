apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"ImageChange","imageChange":{}},{"type":"Generic","secretReference":{"name":"webhooksecret"}}]'
    crane.konveyor.io/conversion-warnings: |-
      [/sample-build] BuildConfig /sample-build sets sourceStrategy.env FOO, BAR, BUILD_LOGLEVEL. The source-to-image strategy does not pass spec.env to s2i, so the assemble script and the output image do not see them. Set each one as NAME=VALUE in the Build's build-env parameter, which the strategy accepts from Builds 1.9, or see https://redhat.atlassian.net/browse/BUILD-2500
      [/sample-build] Output ImageStreamTag "sample-build:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000//sample-build:latest
      [/sample-build] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [/sample-build] BuildConfig sample-build uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [/sample-build] BuildConfig sample-build: ImageChange trigger is dropped — builds will no longer start when the strategy image image-registry.openshift-image-registry.svc:5000/openshift/ruby:3.3-ubi8 changes. Shipwright has no equivalent of image change triggers today.
      [/sample-build] BuildConfig sample-build: Generic webhook trigger is dropped — the old OpenShift webhook URL will stop working after migration, and Shipwright provides no replacement URL. Remove or repoint the webhook in your Git provider, then set up Pipelines-as-Code or Tekton Triggers to create BuildRuns on push events.
      [/sample-build] Found 2 trigger(s) (Generic, ImageChange) on BuildConfig sample-build — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/sample-build
  name: sample-build
spec:
  env:
  - name: FOO
    value: test
  - name: BAR
    value: test
  - name: BUILD_LOGLEVEL
    value: "5"
  output:
    image: image-registry.openshift-image-registry.svc:5000//sample-build:latest
  paramValues:
  - name: builder-image
    value: image-registry.openshift-image-registry.svc:5000/openshift/ruby:3.3-ubi8
  source:
    git:
      url: https://github.com/openshift/ruby-hello-world.git
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
