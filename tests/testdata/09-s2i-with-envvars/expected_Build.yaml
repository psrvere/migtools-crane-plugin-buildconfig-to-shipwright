apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    crane.konveyor.io/conversion-warnings: |-
      [/mys2itest] BuildConfig /mys2itest sets sourceStrategy.env FIELDREF_ENV from a fieldRef or resourceFieldRef. OpenShift read these from the Build object. Shipwright reads them from the BuildRun pod, so metadata.name and labels give the pod's values. Check that the build still gets the value it expects
      [/mys2itest] Output ImageStreamTag "test:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000//test:latest
      [/mys2itest] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [/mys2itest] BuildConfig mys2itest uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/mys2itest
  labels:
    name: test
  name: mys2itest
spec:
  env:
  - name: BUILD_LOGLEVEL
    value: "5"
  - name: FIELDREF_ENV
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: CONFIGMAPKEYREF_ENV
    valueFrom:
      configMapKeyRef:
        key: mykey
        name: myconfigmap
  - name: SECRETKEYREF_ENV
    valueFrom:
      secretKeyRef:
        key: username
        name: mysecret
  - name: FIELDREF_CLONE_ENV
    value: $(FIELDREF_ENV)
  - name: FIELDREF_CLONE_CLONE_ENV
    value: $(FIELDREF_CLONE_ENV)
  - name: UNAVAILABLE_ENV
    value: $(SOME_OTHER_ENV)
  - name: ESCAPED_ENV
    value: $$(MY_ESCAPED_VALUE)
  output:
    image: image-registry.openshift-image-registry.svc:5000//test:latest
    labels:
      user-specified-label: arbitrary-value
  paramValues:
  - name: builder-image
    value: quay.io/redhat-developer/test-build-simples2i:1.2
  - name: build-env
    values:
    - value: BUILD_LOGLEVEL=$(BUILD_LOGLEVEL)
    - value: FIELDREF_ENV=$(FIELDREF_ENV)
    - value: CONFIGMAPKEYREF_ENV=$(CONFIGMAPKEYREF_ENV)
    - value: SECRETKEYREF_ENV=$(SECRETKEYREF_ENV)
    - value: FIELDREF_CLONE_ENV=$(FIELDREF_CLONE_ENV)
    - value: FIELDREF_CLONE_CLONE_ENV=$(FIELDREF_CLONE_CLONE_ENV)
    - value: UNAVAILABLE_ENV=$(UNAVAILABLE_ENV)
    - value: ESCAPED_ENV=$(ESCAPED_ENV)
  source:
    git:
      url: https://github.com/sclorg/nodejs-ex
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
