apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"ConfigChange"},{"type":"ImageChange","imageChange":{}}]'
    crane.konveyor.io/conversion-warnings: |-
      [${NAMESPACE}/${BUILD_NAME}] Output ImageStreamTag "${BUILD_NAME}:latest" resolved to fallback URL: ${REGISTRY}/${NAMESPACE}/${BUILD_NAME}:latest
      [${NAMESPACE}/${BUILD_NAME}] Output image for ImageStreamTag "${NAMESPACE}/${BUILD_NAME}:latest" was redirected off the internal registry to "${REGISTRY}/${NAMESPACE}/${BUILD_NAME}:latest"; the ImageStream will no longer be updated, so any Deployment or DeploymentConfig watching it to roll out will stop firing.
      [${NAMESPACE}/${BUILD_NAME}] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [${NAMESPACE}/${BUILD_NAME}] BuildConfig ${BUILD_NAME} uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [${NAMESPACE}/${BUILD_NAME}] BuildConfig ${BUILD_NAME}: ConfigChange trigger is dropped — the automatic first build will not happen; create a BuildRun manually once to start the first build.
      [${NAMESPACE}/${BUILD_NAME}] BuildConfig ${BUILD_NAME}: ImageChange trigger is dropped — builds will no longer start when the strategy image nodejs:18-ubi8 changes. Shipwright has no equivalent of image change triggers today.
      [${NAMESPACE}/${BUILD_NAME}] Found 2 trigger(s) (ConfigChange, ImageChange) on BuildConfig ${BUILD_NAME} — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/${BUILD_NAME}
  labels:
    application: sample-nodejs
  name: ${BUILD_NAME}
  namespace: ${NAMESPACE}
spec:
  env:
  - name: NPM_MIRROR
    value: https://registry.npmjs.org
  output:
    image: ${REGISTRY}/${NAMESPACE}/${BUILD_NAME}:latest
    insecure: true
  paramValues:
  - name: builder-image
    value: ${BUILDER_IMAGE}
  source:
    contextDir: source-build
    git:
      revision: main
      url: https://github.com/shipwright-io/sample-nodejs
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: ${BUILD_STRATEGY}
