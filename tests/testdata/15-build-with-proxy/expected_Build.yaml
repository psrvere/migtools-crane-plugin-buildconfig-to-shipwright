apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"imageChange","imageChange":{}}]'
    crane.konveyor.io/conversion-warnings: |-
      [/sample-build] Output ImageStreamTag "sample-build:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000//sample-build:latest
      [/sample-build] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [/sample-build] BuildConfig sample-build uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [/sample-build] BuildConfig sample-build: ImageChange trigger is dropped — builds will no longer start when the strategy image quay.io/redhat-developer/test-build-simples2i:1.2 changes. Shipwright has no equivalent of image change triggers today.
      [/sample-build] Found 1 trigger(s) (ImageChange) on BuildConfig sample-build — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/sample-build
  name: sample-build
spec:
  env:
  - name: HTTPS_PROXY
    value: 127.0.0.1:3128
  - name: HTTP_PROXY
    value: 127.0.0.1:3128
  - name: BUILD_LOGLEVEL
    value: "2"
  - name: HTTP_PROXY
    value: 127.0.0.1:3128
  - name: http_proxy
    value: 127.0.0.1:3128
  - name: HTTPS_PROXY
    value: 127.0.0.1:3128
  - name: https_proxy
    value: 127.0.0.1:3128
  output:
    image: image-registry.openshift-image-registry.svc:5000//sample-build:latest
  paramValues:
  - name: builder-image
    value: quay.io/redhat-developer/test-build-simples2i:1.2
  - name: build-env
    values:
    - value: HTTPS_PROXY=$(HTTPS_PROXY)
    - value: HTTP_PROXY=$(HTTP_PROXY)
    - value: BUILD_LOGLEVEL=$(BUILD_LOGLEVEL)
  source:
    git:
      url: https://github.com/openshift/ruby-hello-world.git
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
