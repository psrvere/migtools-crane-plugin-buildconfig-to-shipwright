apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/buildrun-template: |
      apiVersion: shipwright.io/v1beta1
      kind: BuildRun
      metadata:
        name: custom-sa-build-buildrun
        namespace: buildconfig-demo
      spec:
        build:
          name: custom-sa-build
        serviceAccount: custom-builder-sa
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"ConfigChange"}]'
    crane.konveyor.io/conversion-warnings: |-
      [buildconfig-demo/custom-sa-build] BuildConfig buildconfig-demo/custom-sa-build names ServiceAccount "custom-builder-sa" and pull secret "registry-pull-secret". This conversion does not modify that ServiceAccount (the ServiceAccount warning on this Build describes how crane handles it), so attach the pull secret on the target cluster before running the BuildRun: oc -n buildconfig-demo secrets link custom-builder-sa registry-pull-secret --for=pull,mount
      [buildconfig-demo/custom-sa-build] crane migrates ServiceAccount "custom-builder-sa" named by BuildConfig buildconfig-demo/custom-sa-build, with its RoleBindings and any ClusterRoleBinding, ClusterRole or SCC that names it, if the account was in the export. It does not carry the account's secrets list: re-link any secret that was linked with --for=mount. Read the exported _cluster resources before applying them (no --skip-cluster-scoped), and check each name against the target: an SCC or ClusterRole is cluster-global, and an exported SCC carries the source cluster's own users and groups, so one that shares a name with an SCC on the target replaces it. Confirm the account holds the SCC the build strategy needs before running the BuildRun.
      [buildconfig-demo/custom-sa-build] Output ImageStreamTag "custom-sa-build:latest" resolved to fallback URL: quay.io/example/buildconfig-demo/custom-sa-build:latest
      [buildconfig-demo/custom-sa-build] Output image for ImageStreamTag "buildconfig-demo/custom-sa-build:latest" was redirected off the internal registry to "quay.io/example/buildconfig-demo/custom-sa-build:latest"; the ImageStream will no longer be updated, so any Deployment or DeploymentConfig watching it to roll out will stop firing.
      [buildconfig-demo/custom-sa-build] BuildConfig custom-sa-build uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [buildconfig-demo/custom-sa-build] BuildConfig custom-sa-build: ConfigChange trigger is dropped — the automatic first build will not happen. The generated Build carries a BuildRun template (annotation buildconfig-to-shipwright/buildrun-template); apply it once after review to start the first build.
      [buildconfig-demo/custom-sa-build] Found 1 trigger(s) (ConfigChange) on BuildConfig custom-sa-build — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/custom-sa-build
  labels:
    app: custom-sa-test
  name: custom-sa-build
  namespace: buildconfig-demo
spec:
  output:
    image: quay.io/example/buildconfig-demo/custom-sa-build:latest
    pushSecret: registry-push-secret
  paramValues:
  - name: builder-image
    value: quay.io/example/buildconfig-demo/nodejs:latest
  source:
    git:
      revision: master
      url: https://github.com/sclorg/nodejs-ex.git
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
